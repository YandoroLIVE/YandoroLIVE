<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="// 02  SELECT MISSION">
<title>// 02  SELECT MISSION</title>
<style>@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono7';src:url(data:font/woff2;base64,) format('woff2');}

.l{stroke:#2a1016;stroke-width:2}
.glow{animation:run 3.5s cubic-bezier(.7,0,.3,1) infinite}
@keyframes run{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
.lab{font-family:'Mono7', Consolas, 'Courier New', monospace;font-size:14px;letter-spacing:4px;fill:#ff2a3d}
.lab2{font-family:'Mono', Consolas, 'Courier New', monospace;font-size:12px;letter-spacing:3px;fill:#8a8a99}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#ff2a3d" stop-opacity="0"/><stop offset=".8" stop-color="#ff2a3d"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<line class="l" x1="0" y1="20" x2="1200" y2="20"/>
<rect class="glow" x="0" y="19" width="300" height="2" fill="url(#gl)"/>
<rect x="0" y="6" width="300.4" height="28" fill="#08080c"/>
<path d="M0 6 H10 M0 6 V34 H10" stroke="#ff2a3d" stroke-width="2" fill="none"/>
<text class="lab" x="20" y="25">// 02  SELECT MISSION</text>
<rect x="1050" y="6" width="150" height="28" fill="#08080c"/>
<text class="lab2" x="1200" y="25" text-anchor="end">[ PROJECTS ]</text>

</svg>
