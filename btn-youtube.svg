<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56" role="img" aria-label="YOUTUBE">
<title>YOUTUBE</title>
<style>@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}

.b{fill:#0c0c12;stroke:#ff3b3b;stroke-width:1.5}
.l{font-family:'Orb', 'Segoe UI', Arial, sans-serif;font-size:15px;letter-spacing:3px;fill:#e9e9ef;text-anchor:middle}
.sh{animation:sh 3.2s ease-in-out infinite}
