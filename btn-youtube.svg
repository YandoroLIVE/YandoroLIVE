@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3b3b" stop-opacity=".35"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
<clipPath id="c"><path d="M12 2 H218 V42 L206 54 H2 V14 Z"/></clipPath></defs>
<path class="b" d="M12 2 H218 V42 L206 54 H2 V14 Z"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="60" height="56" fill="url(#g)"/></g>
<rect x="2" y="22" width="4" height="12" fill="#ff3b3b"/>
<text class="l" x="110.0" y="34">YOUTUBE</text>

</svg>
