<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Thanks for playing">
<title>Thanks for playing</title>
<style>@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2');}

.t{font-family:'Orb', 'Segoe UI', Arial, sans-serif;font-size:40px;letter-spacing:10px;fill:#e9e9ef;text-anchor:middle}
.t .r{fill:#ff2a3d}
.c{font-family:'Orb', 'Segoe UI', Arial, sans-serif;font-size:26px;letter-spacing:8px;fill:#ff2a3d;text-anchor:end}
.cnt{font-family:'Orb', 'Segoe UI', Arial, sans-serif;font-size:46px;fill:#ff2a3d;text-anchor:middle;opacity:0;animation:cnt 10s steps(1) infinite}
@keyframes cnt{0%,9.9%{opacity:1}10%,100%{opacity:0}}
.cnt{transform-box:fill-box;transform-origin:center}
.ps{font-family:'Mono', Consolas, 'Courier New', monospace;font-size:14px;letter-spacing:4px;fill:#8a8a99;text-anchor:middle;animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<rect width="1200" height="200" fill="#08080c"/>
<line x1="0" y1="1" x2="1200" y2="1" stroke="#2a1016" stroke-width="2"/>
<text class="t" x="600" y="80">THANKS FOR <tspan class="r">PLAYING</tspan></text>
<text class="c" x="560" y="146">CONTINUE?</text>
<text class="cnt" x="600" y="150" style="animation-delay:0s">9</text><text class="cnt" x="600" y="150" style="animation-delay:1s">8</text><text class="cnt" x="600" y="150" style="animation-delay:2s">7</text><text class="cnt" x="600" y="150" style="animation-delay:3s">6</text><text class="cnt" x="600" y="150" style="animation-delay:4s">5</text><text class="cnt" x="600" y="150" style="animation-delay:5s">4</text><text class="cnt" x="600" y="150" style="animation-delay:6s">3</text><text class="cnt" x="600" y="150" style="animation-delay:7s">2</text><text class="cnt" x="600" y="150" style="animation-delay:8s">1</text><text class="cnt" x="600" y="150" style="animation-delay:9s">0</text>
<text class="ps" x="600" y="186">PRESS ANY BUTTON ABOVE TO CONNECT</text>

</svg>
